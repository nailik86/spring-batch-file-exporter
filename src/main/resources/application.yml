spring:
  datasource:
    url: jdbc:mysql://localhost:3306/batch_exporter_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

# --- Configuration des exports ---
# Pour ajouter un nouvel export :
#   1. Creer une classe qui implemente ExportService
#   2. Ajouter une entree ci-dessous
batch:
  exports:
    magasin:
      bean: magasin
      file-type: json
      output-dir: ./output/magasins
      output-file: magasins_export.json
    product:
      bean: product
      file-type: json
      output-dir: ./output/products
      output-file: products_export.json
