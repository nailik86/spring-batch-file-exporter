spring:
  datasource:
    url: jdbc:mysql://localhost:3306/batch_exporter_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: true

batch:
  export:
    format: json          # Changez en csv, xml, yaml, etc.
    output-dir: ./output
    chunk-size: 100
